[build]
  publish = "."
  command = "printf '{\"commit\":\"%s\",\"build_id\":\"%s\",\"context\":\"%s\",\"deployed_at\":\"%s\"}\\n' \"$COMMIT_REF\" \"$BUILD_ID\" \"$CONTEXT\" \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" > deploy.json"

[[headers]]
  for = "/deploy.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

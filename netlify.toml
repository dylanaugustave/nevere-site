[build]
  publish = "."
  command = "node site-source.mjs && node site-update.mjs"

[[headers]]
  for = "/deploy.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
